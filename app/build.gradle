plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def buildPythonPath = localProps.getProperty('buildPython', 'python')
def ytdlWheel = localProps.getProperty('ytdlWheel', './libs/youtube_dl-2025.4.7-py2.py3-none-any.whl')

android {
    namespace 'com.fork.ytdl'
    compileSdk 35

    defaultConfig {
        applicationId "com.fork.ytdl"
        minSdk 24
        targetSdk 28
        versionCode 6
        versionName "2025.04.07-fork.6"
        ndk { abiFilters "arm64-v8a" }
    }

    buildTypes {
        debug { applicationIdSuffix "" }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
}

chaquopy {
    defaultConfig {
        version "3.12"
        buildPython buildPythonPath
        pip {
            install ytdlWheel
        }
    }
}
