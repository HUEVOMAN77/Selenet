plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def buildPythonPath = localProps.getProperty('buildPython', 'python')
def ytdlWheel = localProps.getProperty('ytdlWheel', './libs/youtube_dl-2025.4.7-py2.py3-none-any.whl')

// La firma de release vive afuera del repositorio; local.properties esta gitignoreado.
// Sin esas cuatro lineas el build sigue usando la clave de debug, que no sirve para actualizar.
def ksPath = localProps.getProperty('keystoreFile', '')
def ksStore = localProps.getProperty('keystoreStorePassword', '')
def ksAlias = localProps.getProperty('keystoreAlias', '')
def ksKey = localProps.getProperty('keystoreKeyPassword', '')
def signed = !([ksPath, ksStore, ksAlias, ksKey].contains(''))

android {
    namespace 'com.fork.ytdl'
    compileSdk 35

    signingConfigs {
        fork {
            if (signed) {
                storeFile file(ksPath)
                storePassword ksStore
                keyAlias ksAlias
                keyPassword ksKey
            }
        }
    }

    defaultConfig {
        applicationId "com.fork.ytdl"
        minSdk 24
        targetSdk 28
        versionCode 10400
        versionName "1.4-estilo.1"
        ndk { abiFilters "arm64-v8a" }
    }

    buildTypes {
        debug { applicationIdSuffix "" }
        release {
            minifyEnabled false
            signingConfig signed ? signingConfigs.fork : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    buildFeatures {
        viewBinding true
        // el numero de build se muestra en Ajustes: sin esto es imposible distinguir
        // dos APK con el mismo versionCode, que es justo lo que paso con la prueba
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
}

chaquopy {
    defaultConfig {
        version "3.12"
        buildPython buildPythonPath
        pip {
            install ytdlWheel
        }
    }
}
